name: app-planner
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: "${APP_DB_NAME}"
      POSTGRES_USER: "${APP_DB_USER}"
      POSTGRES_PASSWORD: "${APP_DB_PASS}"
    ports:
      - "${APP_DB_PORT}:5432"
    volumes:
      - "./${APP_DB_DIR}:/var/lib/postgresql/data"
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
